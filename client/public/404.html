<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>DevConnect</title>
    <script>
      // Preserve the requested SPA path when GitHub Pages serves its 404 page.
      const path = window.location.pathname;
      const repo = "/devconnect";
      const route = path.startsWith(repo) ? path.slice(repo.length) : path;
      window.location.replace(`${repo}/?/${encodeURIComponent(route.replace(/^\//, ""))}`);
    </script>
  </head>
  <body></body>
</html>
