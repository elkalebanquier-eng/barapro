<body>
<div id="root"></div>

<script type="module">
import htm from 'https://esm.sh/htm@3.1.1?target=es2020';
import React from 'https://esm.sh/react@18.3.1?target=es2020';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?target=es2020';

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  getRedirectResult, onAuthStateChanged, signOut
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
import {
  getFirestore, collection, addDoc, doc, setDoc, getDoc, serverTimestamp,
  query, orderBy, limit, onSnapshot, enableIndexedDbPersistence
} from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

const html = htm.bind(React.createElement);
const { useState, useEffect, useRef, useCallback } = React;

/*
 * ONE-X Dev — architecture en un coup d'œil
 * -------------------------------------
 * 1 seul fichier, aucune étape de build : ouvrable directement, déployable tel quel.
 * React + htm (pas de JSX) chargés depuis un CDN ; Firebase (Auth + Firestore) réel, aucun mock.
 *
 * Collections Firestore utilisées :
 *   users/{uid}     -> profil public (name, bio, skills, photo, email)
 *   missions/{id}   -> missions publiées (title, description, budget, category, tags, authorUid...)
 *   messages/{id}   -> chat public, un seul salon pour l'instant
 *
 * Parcours d'un utilisateur (voir composant App tout en bas) :
 *   pas connecté -> LoginScreen (Google)
 *   connecté, sans profil Firestore -> OnboardingScreen (inscription)
 *   connecté, avec profil -> Home / Publier / Messages / Profil (navigation par onglets)
 *
 * Pour ajouter un écran : créer un composant plus bas, l'ajouter à l'objet `screens`
 * et à `navItems` dans App(), et éventuellement au routage users/{uid} si besoin de profil.
 */

/* ---------- Firebase (réel, pas de mock) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyBtZi5TQ_NXH-v_Rcm0XGH881gQyMg_uUI",
  authDomain: "devconect-e6a5d.firebaseapp.com",
  projectId: "devconect-e6a5d",
  storageBucket: "devconect-e6a5d.firebasestorage.app",
  messagingSenderId: "236553916467",
  appId: "1:236553916467:web:62cb4f34e21af795031346"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
try { enableIndexedDbPersistence(db); } catch (e) { /* déjà activé ailleurs, sans gravité */ }

/* Détecte les WebView Android/iOS où Google refuse l'OAuth par design.
   Dans ce cas mieux vaut ouvrir le vrai navigateur que d'afficher une erreur Google. */
function isEmbeddedWebView() {
  const ua = navigator.userAgent || '';
  return /; wv\)/i.test(ua) || /Instagram|FBAN|FBAV|Line\//i.test(ua);
}

async function loginWithGoogle() {
  const provider = new GoogleAuthProvider();
  provider.addScope('profile');
  provider.addScope('email');
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await signInWithPopup(auth, provider);
  } catch (err) {
    const code = err && err.code;
    // Popup bloqué / fermé / non supporté sur mobile -> on retente en redirection.
    if (code === 'auth/popup-blocked' || code === 'auth/cancelled-popup-request' ||
        code === 'auth/operation-not-supported-in-this-environment') {
      await signInWithRedirect(auth, provider);
      return;
    }
    throw err;
  }
}

/* ---------- Petits composants d'icônes (inline, zéro dépendance) ---------- */
const Icon = {
  home: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg>`,
  briefcase: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  plus: html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  chat: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
  user: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
  moon: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>`,
  send: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>`,
  logout: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>`,
};

/* ---------- Toast global ---------- */
/* Petit hook pour afficher un message éphémère en bas d'écran (ex: "Mission publiée ✓"). */
function useToast(){
  const [msg, setMsg] = useState(null);
  const show = useCallback((text) => {
    setMsg(text);
    clearTimeout(show._t);
    show._t = setTimeout(() => setMsg(null), 2600);
  }, []);
  return [msg, show];
}

/* ---------- Écran de connexion ---------- */
function LoginScreen({ onLogin, loading, error }) {
  return html`
    <div>
    <div class="hero-bg"/>
    <div class="wrap" style=${{paddingTop:'18vh'}}>
      <div class="row" style=${{justifyContent:'center'}}>
        <div class="logo" style=${{width:56,height:56,borderRadius:16,fontSize:20}}>1X</div>
      </div>
      <h1 style=${{textAlign:'center',fontSize:26,margin:'18px 0 6px'}}>ONE-X Dev</h1>
      <p class="muted" style=${{textAlign:'center',margin:'0 0 28px',fontSize:14.5}}>
        La communauté des développeurs d'Afrique de l'Ouest.
      </p>
      ${error && html`<div class="banner banner-error" style=${{marginBottom:14}}>${error}</div>`}
      <button class="btn btn-primary btn-full row gap-2" style=${{justifyContent:'center',height:52}}
        onClick=${onLogin} disabled=${loading}>
        ${loading ? html`<span class="spinner"/>` : html`<span style=${{fontSize:17}}>G</span>`}
        ${loading ? 'Connexion…' : 'Continuer avec Google'}
      </button>
      <p class="muted" style=${{textAlign:'center',fontSize:12,marginTop:16}}>
        En continuant, tu acceptes de rejoindre une communauté publique.
      </p>
    </div>
    </div>
  `;
}

/* ---------- Inscription (complétée après la 1ère connexion Google) ----------
   On ne force que le nom (déjà fourni par Google, mais modifiable) ; la bio
   et les compétences sont facultatives pour ne pas bloquer un nouvel arrivant. */
function OnboardingScreen({ user, existing, onDone }) {
  const [name, setName] = useState(existing?.name || user.displayName || '');
  const [bio, setBio] = useState(existing?.bio || '');
  const [skillInput, setSkillInput] = useState('');
  const [skills, setSkills] = useState(existing?.skills || []);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');

  function addSkill() {
    const s = skillInput.trim();
    if (s && !skills.includes(s)) setSkills([...skills, s]);
    setSkillInput('');
  }

  async function save() {
    if (!name.trim()) { setError('Ton nom est obligatoire.'); return; }
    setSaving(true); setError('');
    try {
      const profile = {
        name: name.trim(),
        bio: bio.trim(),
        skills,
        email: user.email || '',
        photo: user.photoURL || '',
        updatedAt: serverTimestamp(),
      };
      // setDoc(..., {merge:true}) : ne touche que ces champs, ne recrée pas createdAt à chaque édition.
      await setDoc(doc(db, 'users', user.uid), {
        ...profile,
        createdAt: existing?.createdAt || serverTimestamp(),
      }, { merge: true });
      onDone(profile);
    } catch (err) {
      setError("Impossible d'enregistrer ton profil (" + err.code + "). Vérifie les règles Firestore.");
    } finally {
      setSaving(false);
    }
  }

  return html`
    <div class="wrap" style=${{paddingTop:'8vh'}}>
      <h1 style=${{fontSize:22,margin:'4px 0 4px'}}>
        ${existing ? 'Modifier mon profil' : 'Complète ton profil'}
      </h1>
      <p class="muted" style=${{fontSize:13.5,margin:'0 0 20px'}}>
        ${existing ? 'Mets à jour tes infos publiques.' : "C'est ce que les autres devs verront de toi."}
      </p>
      ${error && html`<div class="banner banner-error" style=${{marginBottom:14}}>${error}</div>`}
      <div class="field">
        <label class="label">Nom</label>
        <input class="input" value=${name} onInput=${(e)=>setName(e.target.value)}/>
      </div>
      <div class="field">
        <label class="label">Bio <span style=${{fontWeight:400}}>(optionnel)</span></label>
        <textarea class="input" placeholder="Ex : Dev full-stack, 3 ans d'XP, spécialisé Firebase…"
          value=${bio} onInput=${(e)=>setBio(e.target.value)}/>
      </div>
      <div class="field">
        <label class="label">Compétences <span style=${{fontWeight:400}}>(optionnel)</span></label>
        <div class="row gap-2">
          <input class="input" placeholder="React, Firebase…" value=${skillInput}
            onInput=${(e)=>setSkillInput(e.target.value)}
            onKeyDown=${(e)=>{ if(e.key==='Enter'){ e.preventDefault(); addSkill(); } }}/>
          <button class="btn" onClick=${addSkill}>Ajouter</button>
        </div>
        ${skills.length>0 && html`
          <div class="row gap-1" style=${{flexWrap:'wrap',marginTop:10}}>
            ${skills.map(s => html`
              <span class="tag" key=${s} style=${{cursor:'pointer'}}
                onClick=${()=>setSkills(skills.filter(x=>x!==s))}>${s} ✕</span>
            `)}
          </div>
        `}
      </div>
      <button class="btn btn-primary btn-full row gap-2" style=${{justifyContent:'center',height:50,marginTop:6}}
        onClick=${save} disabled=${saving}>
        ${saving ? html`<span class="spinner"/>` : null}
        ${saving ? 'Enregistrement…' : (existing ? 'Enregistrer' : 'Terminer mon inscription')}
      </button>
    </div>
  `;
}

/* ---------- Carte mission ---------- */
/* Affiche une mission dans la liste Accueil. `m` = un document de la collection `missions`. */
function MissionCard({ m }) {
  return html`
    <div class="card" style=${{marginBottom:12}}>
      <div class="row between" style=${{marginBottom:8}}>
        <strong style=${{fontSize:15.5}}>${m.title}</strong>
        ${m.budget && html`<span class="tag">${m.budget}</span>`}
      </div>
      ${m.description && html`<p class="muted" style=${{fontSize:13.5,margin:'0 0 10px',lineHeight:1.5}}>${m.description}</p>`}
      <div class="row gap-1" style=${{flexWrap:'wrap',marginBottom:m.authorName?10:0}}>
        ${m.category && html`
          <span class="tag row gap-1" style=${{alignItems:'center'}}>
            <span class="cat-dot" style=${{background:categoryColor(m.category)}}/>${m.category}
          </span>
        `}
        ${(m.tags||[]).map((t) => html`<span class="tag" key=${t}>${t}</span>`)}
      </div>
      ${m.authorName && html`
        <div class="row gap-2 muted" style=${{fontSize:12.5}}>
          <img class="avatar" style=${{width:20,height:20}} src=${m.authorPhoto||''} onError=${(e)=>e.target.style.visibility='hidden'}/>
          <span>${m.authorName}</span>
        </div>
      `}
    </div>
  `;
}

/* ---------- Accueil ---------- */
function HomeScreen({ user, profile }) {
  const [missions, setMissions] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => {
    const q = query(collection(db, 'missions'), orderBy('createdAt', 'desc'), limit(20));
    const unsub = onSnapshot(q,
      (snap) => setMissions(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      (err) => setError("Impossible de charger les missions (" + err.code + ").")
    );
    return unsub;
  }, []);

  return html`
    <div class="wrap">
      <div class="row gap-3" style=${{margin:'4px 0 18px'}}>
        <img class="avatar" src=${user.photoURL||''} onError=${(e)=>e.target.style.visibility='hidden'}/>
        <div>
          <div style=${{fontSize:16,fontWeight:700}}>Salut, ${firstName((profile && profile.name) || user.displayName)} 👋</div>
          <div class="muted" style=${{fontSize:13}}>Voici les dernières missions publiées</div>
        </div>
      </div>
      ${error && html`<div class="banner banner-error" style=${{marginBottom:14}}>${error}</div>`}
      ${missions === null && !error && html`
        <div class="skeleton" style=${{height:96,marginBottom:12}}/>
        <div class="skeleton" style=${{height:96,marginBottom:12}}/>
        <div class="skeleton" style=${{height:96}}/>
      `}
      ${missions && missions.length === 0 && html`
        <div class="empty">
          <div style=${{fontSize:15,fontWeight:600,color:'var(--text)',marginBottom:4}}>Aucune mission pour l'instant</div>
          <div style=${{fontSize:13.5}}>Sois le premier à en publier une.</div>
        </div>
      `}
      ${missions && missions.map(m => html`<${MissionCard} key=${m.id} m=${m}/>`)}
    </div>
  `;
}

/* ---------- Publier ---------- */
function PublishScreen({ user, profile, showToast, goHome }) {
  const [title, setTitle] = useState('');
  const [description, setDescription] = useState('');
  const [budget, setBudget] = useState('');
  const [category, setCategory] = useState('Web App');
  const [tagInput, setTagInput] = useState('');
  const [tags, setTags] = useState([]);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState('');

  function addTag() {
    const t = tagInput.trim();
    if (t && !tags.includes(t)) setTags([...tags, t]);
    setTagInput('');
  }

  async function publish() {
    if (!title.trim()) { setError('Ajoute un titre à ta mission.'); return; }
    setSending(true); setError('');
    try {
      await addDoc(collection(db, 'missions'), {
        title: title.trim(),
        description: description.trim(),
        budget: budget.trim(),
        category,
        tags,
        authorUid: user.uid,
        authorName: (profile && profile.name) || user.displayName || 'Dev anonyme',
        authorPhoto: (profile && profile.photo) || user.photoURL || '',
        createdAt: serverTimestamp(),
      });
      showToast('Mission publiée ✓');
      setTitle(''); setDescription(''); setBudget(''); setTags([]);
      goHome();
    } catch (err) {
      setError("La publication a échoué (" + err.code + "). Vérifie les règles Firestore.");
    } finally {
      setSending(false);
    }
  }

  return html`
    <div class="wrap">
      <h2 style=${{fontSize:19,margin:'4px 0 16px'}}>Publier une mission</h2>
      ${error && html`<div class="banner banner-error" style=${{marginBottom:14}}>${error}</div>`}
      <div class="field">
        <label class="label">Titre</label>
        <input class="input" placeholder="Ex : Landing SaaS Framer + Stripe"
          value=${title} onInput=${(e)=>setTitle(e.target.value)}/>
      </div>
      <div class="field">
        <label class="label">Description</label>
        <textarea class="input" placeholder="Détails, stack, livrables…"
          value=${description} onInput=${(e)=>setDescription(e.target.value)}/>
      </div>
      <div class="row gap-2" style=${{marginBottom:14}}>
        <div class="field" style=${{flex:1,marginBottom:0}}>
          <label class="label">Budget</label>
          <input class="input" placeholder="500€ - 1500€"
            value=${budget} onInput=${(e)=>setBudget(e.target.value)}/>
        </div>
        <div class="field" style=${{flex:1,marginBottom:0}}>
          <label class="label">Catégorie</label>
          <select class="input" value=${category} onChange=${(e)=>setCategory(e.target.value)}>
            ${CATEGORIES.map(c=>html`<option key=${c.name} value=${c.name}>${c.name}</option>`)}
          </select>
        </div>
      </div>
      <div class="field">
        <label class="label">Compétences (tags)</label>
        <div class="row gap-2">
          <input class="input" placeholder="React, Firebase…" value=${tagInput}
            onInput=${(e)=>setTagInput(e.target.value)}
            onKeyDown=${(e)=>{ if(e.key==='Enter'){ e.preventDefault(); addTag(); } }}/>
          <button class="btn" onClick=${addTag}>Ajouter</button>
        </div>
        ${tags.length>0 && html`
          <div class="row gap-1" style=${{flexWrap:'wrap',marginTop:10}}>
            ${tags.map(t => html`
              <span class="tag" key=${t} style=${{cursor:'pointer'}}
                onClick=${()=>setTags(tags.filter(x=>x!==t))}>${t} ✕</span>
            `)}
          </div>
        `}
      </div>
      <button class="btn btn-primary btn-full row gap-2" style=${{justifyContent:'center',height:50,marginTop:6}}
        onClick=${publish} disabled=${sending}>
        ${sending ? html`<span class="spinner"/>` : Icon.plus}
        ${sending ? 'Publication…' : 'Publier la mission'}
      </button>
    </div>
  `;
}

/* ---------- Messages (chat public temps réel) ---------- */
function MessagesScreen({ user, profile }) {
  const [msgs, setMsgs] = useState(null);
  const [text, setText] = useState('');
  const [error, setError] = useState('');
  const bottomRef = useRef(null);

  useEffect(() => {
    const q = query(collection(db, 'messages'), orderBy('createdAt', 'asc'), limit(100));
    const unsub = onSnapshot(q,
      (snap) => setMsgs(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      (err) => setError("Chat indisponible (" + err.code + ").")
    );
    return unsub;
  }, []);

  useEffect(() => {
    if (bottomRef.current) bottomRef.current.scrollIntoView({ block: 'end' });
  }, [msgs]);

  async function send() {
    const t = text.trim();
    if (!t) return;
    setText('');
    try {
      await addDoc(collection(db, 'messages'), {
        text: t, uid: user.uid,
        name: (profile && profile.name) || user.displayName || 'Dev',
        photo: (profile && profile.photo) || user.photoURL || '',
        createdAt: serverTimestamp(),
      });
    } catch (err) {
      setError("Envoi impossible (" + err.code + ").");
    }
  }

  return html`
    <div class="wrap" style=${{display:'flex',flexDirection:'column',minHeight:'calc(100vh - 100px)'}}>
      <h2 style=${{fontSize:19,margin:'4px 0 14px'}}>Messages</h2>
      ${error && html`<div class="banner banner-error" style=${{marginBottom:12}}>${error}</div>`}
      <div style=${{flex:1}}>
        ${msgs === null && !error && html`<div class="skeleton" style=${{height:60,marginBottom:10}}/>`}
        ${msgs && msgs.length === 0 && html`
          <div class="empty">
            <div style=${{fontSize:15,fontWeight:600,color:'var(--text)'}}>Aucun message pour l'instant</div>
            <div style=${{fontSize:13.5}}>Lance la première conversation.</div>
          </div>
        `}
        ${msgs && msgs.map(m => html`
          <div key=${m.id} class="row gap-2" style=${{alignItems:'flex-start',marginBottom:12}}>
            <img class="avatar" style=${{width:30,height:30}} src=${m.photo||''} onError=${(e)=>e.target.style.visibility='hidden'}/>
            <div>
              <div style=${{fontSize:12.5,fontWeight:600,color:'var(--muted)',marginBottom:2}}>${m.name}</div>
              <div class="card" style=${{padding:'8px 12px',display:'inline-block'}}>${m.text}</div>
            </div>
          </div>
        `)}
        <div ref=${bottomRef}/>
      </div>
      <div class="row gap-2" style=${{position:'sticky',bottom:0,paddingTop:10,background:'var(--bg)'}}>
        <input class="input" placeholder="Écris un message…" value=${text}
          onInput=${(e)=>setText(e.target.value)}
          onKeyDown=${(e)=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } }}/>
        <button class="btn btn-primary" style=${{padding:'0 16px'}} onClick=${send}>${Icon.send}</button>
      </div>
    </div>
  `;
}

/* ---------- Profil ---------- */

  return html`
    <div class="wrap">
      <div class="card" style=${{textAlign:'center',padding:'28px 16px',marginBottom:16}}>
        <img class="avatar" style=${{width:76,height:76,margin:'0 auto 14px'}}
          src=${user.photoURL||''} onError=${(e)=>e.target.style.visibility='hidden'}/>
        <div style=${{fontSize:18,fontWeight:700}}>${profile?.name || user.displayName}</div>
        <div class="muted" style=${{fontSize:13.5,marginBottom:profile?.bio?10:0}}>${user.email}</div>
        ${profile?.bio && html`<p style=${{fontSize:13.5,margin:'0 0 10px',lineHeight:1.5}}>${profile.bio}</p>`}
        ${profile?.skills?.length>0 && html`
          <div class="row gap-1" style=${{flexWrap:'wrap',justifyContent:'center'}}>
            ${profile.skills.map(s => html`<span class="tag" key=${s}>${s}</span>`)}
          </div>
        `}
      </div>
      <button class="btn btn-full" style=${{marginBottom:12}} onClick=${onEdit}>Modifier mon profil</button>
      <div class="card row between" style=${{marginBottom:12}}>
        <span style=${{fontSize:14,fontWeight:600}}>Mode sombre</span>
        <button class="btn" onClick=${()=>setTheme(theme==='dark'?'light':'dark')}>
          ${theme==='dark' ? 'Désactiver' : 'Activer'}
        </button>
      </div>
      <button class="btn btn-full row gap-2" style=${{justifyContent:'center',color:'var(--danger)',borderColor:'var(--danger)'}}
        onClick=${onLogout}>

      </button>
    </div>
  `;
}

function firstName(name){ return (name||'').split(' ')[0] || 'là'; }

/* Catégories de mission avec leur couleur associée (utilisé dans MissionCard et PublishScreen). */
const CATEGORIES = [
  { name: 'Web App', color: '#2563FF' },
  { name: 'Mobile', color: '#16a34a' },
  { name: 'API / Backend', color: '#9333ea' },
  { name: 'Design UI', color: '#ea580c' },
  { name: 'Autre', color: '#71717a' },
];
function categoryColor(name) {
  const c = CATEGORIES.find(c => c.name === name);
  return c ? c.color : '#71717a';
}

/* ---------- App racine ----------
   Ordonnance générale :
   1. Auth Firebase (onAuthStateChanged) -> user
   2. Une fois connecté, on va chercher users/{uid} dans Firestore -> profile
      - profile === undefined : en cours de chargement
      - profile === null      : n'existe pas encore -> écran d'inscription obligatoire
      - profile === objet     : profil complet -> app normale
*/
function App() {
  const [user, setUser] = useState(undefined);   // undefined = chargement initial, null = déconnecté
  const [profile, setProfile] = useState(undefined); // undefined = pas encore vérifié, null = inscription requise
  const [tab, setTab] = useState('home');
  const [editingProfile, setEditingProfile] = useState(false); // "Modifier mon profil" depuis l'onglet Profil
  const [loginLoading, setLoginLoading] = useState(false);
  const [loginError, setLoginError] = useState('');
  const [theme, setTheme] = useState(() => localStorage.getItem('onex-theme') || 'auto');
  const [toast, showToast] = useToast();

  // Thème clair/sombre : "auto" laisse le système décider (voir la media query CSS).
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme === 'auto' ? '' : theme);
    if (theme !== 'auto') localStorage.setItem('onex-theme', theme); else localStorage.removeItem('onex-theme');
  }, [theme]);

  // Connexion : écoute l'état Firebase + termine un éventuel retour de signInWithRedirect (fallback mobile).
  useEffect(() => {
    getRedirectResult(auth).catch((err) => setLoginError(describeAuthError(err)));
    const unsub = onAuthStateChanged(auth, (u) => { setUser(u); if (!u) setProfile(undefined); });
    return unsub;
  }, []);

  // Une fois connecté, on va lire le profil Firestore correspondant (une seule fois, pas de temps réel ici).
  useEffect(() => {
    if (!user) return;
    let cancelled = false;
    getDoc(doc(db, 'users', user.uid)).then((snap) => {
      if (cancelled) return;
      setProfile(snap.exists() ? snap.data() : null);
    }).catch(() => { if (!cancelled) setProfile(null); });
    return () => { cancelled = true; };
  }, [user]);

  async function handleLogin() {
    setLoginLoading(true); setLoginError('');
    try {
      await loginWithGoogle();
    } catch (err) {
      setLoginError(describeAuthError(err));
    } finally {
      setLoginLoading(false);
    }
  }

  function handleLogout() {
    signOut(auth);
    setTab('home');
  }

  // 1) Vérification de session en cours
  if (user === undefined) {
    return html`<div class="wrap" style=${{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh'}}><span class="spinner" style=${{borderTopColor:'var(--accent)',borderColor:'var(--border)'}}/></div>`;
  }

  // 2) Pas connecté -> écran de connexion Google
  if (!user) {
    return html`<${LoginScreen} onLogin=${handleLogin} loading=${loginLoading} error=${loginError}/>`;
  }

  // 3) Connecté mais profil pas encore chargé -> petit spinner (généralement instantané)
  if (profile === undefined) {
    return html`<div class="wrap" style=${{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh'}}><span class="spinner" style=${{borderTopColor:'var(--accent)',borderColor:'var(--border)'}}/></div>`;
  }

  // 4) Profil absent (1ère connexion) ou édition demandée depuis l'onglet Profil -> formulaire d'inscription
  if (profile === null || editingProfile) {
    return html`<${OnboardingScreen} user=${user} existing=${editingProfile ? profile : null}
      onDone=${(p)=>{ setProfile(p); setEditingProfile(false); showToast(editingProfile ? 'Profil mis à jour ✓' : 'Bienvenue sur ONE-X ✓'); }}/>`;
  }

  const screens = {
    home: html`<${HomeScreen} user=${user} profile=${profile}/>`,
    publish: html`<${PublishScreen} user=${user} profile=${profile} showToast=${showToast} goHome=${()=>setTab('home')}/>`,
    messages: html`<${MessagesScreen} user=${user} profile=${profile}/>`,
    profile: html`<${ProfileScreen} user=${user} profile=${profile} theme=${theme} setTheme=${setTheme}
      onLogout=${handleLogout} onEdit=${()=>setEditingProfile(true)}/>`,
  };

  const navItems = [
    { k: 'home', label: 'Accueil', icon: Icon.home },
    { k: 'publish', label: 'Publier', icon: Icon.plus },
    { k: 'messages', label: 'Messages', icon: Icon.chat },
    { k: 'profile', label: 'Profil', icon: Icon.user },
  ];

  return html`
    <div>
      ${screens[tab]}
      <nav class="nav">
        ${navItems.map(item => html`
          <button key=${item.k} class=${'nav-btn' + (tab===item.k?' active':'')} onClick=${()=>setTab(item.k)}>
            ${item.icon}<span>${item.label}</span>
          </button>
        `)}
      </nav>
      ${toast && html`<div class="toast">${toast}</div>`}
    </div>
  `;
}

/* Traduit les codes d'erreur Firebase Auth en message compréhensible pour un humain. */
function describeAuthError(err) {
  if (!err) return '';
  const code = err.code || '';
  if (isEmbeddedWebView()) return "Ouvre ce lien dans Chrome ou Safari : Google bloque la connexion dans les vues intégrées (WebView).";
  if (code === 'auth/unauthorized-domain') return "Ce domaine n'est pas autorisé dans Firebase Console → Authentication → Settings → Domaines autorisés.";
  if (code === 'auth/popup-closed-by-user') return "Fenêtre Google fermée avant la fin de la connexion.";
  if (code === 'auth/network-request-failed') return "Pas de connexion internet.";
  return "Connexion impossible (" + (code || 'erreur inconnue') + ").";
}

createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
